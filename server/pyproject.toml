[project]
name = "cadquery-catalog"
version = "0.4.0"
description = "Parametric CadQuery models, customised in the browser."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "black>=24.0.0",
    "fastapi[standard]>=0.115.12",
    "itsdangerous>=2.2.0",
    "nh3>=0.2.21",
    "profanityfilter>=2.1.0",
    "pyparsing>=3.2.3",
    "sqlmodel>=0.0.24",
]

[tool.ruff]
line-length = 120

[project.scripts]
catalog = "app.runner:runner"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: needs a real inner podman and the sandbox image"]
testpaths = ["tests"]