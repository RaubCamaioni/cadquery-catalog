{# tags editor: `tags` (list) are the current ones. Each chip holds a hidden `tags` input; `tags.present` tells
   the server the editor was shown, so an emptied editor clears the tags. Typing suggests tags already in use. #}
<div class="meta-editor" data-kind="tags" data-free="1" data-max="10" data-suggest="{{ root_path }}/tags/suggest">
    <input type="hidden" name="tags.present" value="1">
    <span class="text-dim">tags:</span>
    <span class="meta-chips">
        {%- for tag in tags %}
        <span class="meta-chip" data-value="{{ tag }}"><span class="meta-chip-label">{{ tag }}</span><input
            type="hidden" name="tags" value="{{ tag }}"><button type="button"
            class="meta-remove text-dim hover:bg-paper hover:text-ink">[x]</button></span>
        {%- endfor %}
    </span>
    <span class="field meta-field"><input
        class="meta-input"
        type="text"
        list="tag-suggestions-{{ editor_id }}"
        autocomplete="off"
        spellcheck="false"
        placeholder="add a tag, Enter"
        aria-label="add a tag"></span>
    <datalist id="tag-suggestions-{{ editor_id }}"></datalist>
    <span class="meta-note text-dim"></span>
</div>
