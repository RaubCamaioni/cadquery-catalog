<style>
    stl-viewer { display: block; width: 100%; height: 480px; }
    /* model page: the viewer takes the row, the parameter panel sits beside it and wraps below when narrow */
    .model-layout { display: flex; flex-wrap: wrap; align-items: stretch; }
    /* the viewer column carries the rule between it and the parameter panel, as the code column does
       on the source view; when the panel wraps below, its own top rule takes over */
    .model-column {
        flex: 999 1 30rem; min-width: 0; display: flex; flex-direction: column; position: relative;
        border-right: 1px solid var(--color-line); margin-right: -1px;
    }
    .model-column .loadbar { position: absolute; top: 0; left: 0; right: 0; z-index: 2; }
    .model-result stl-viewer { border-bottom: 1px solid var(--color-line); }
    .model-meta {
        display: grid; grid-template-columns: max-content 1fr; column-gap: 2ch; row-gap: 0.1rem;
        padding: 0.5rem 0.75rem;
    }
    /* gallery: cards with the SVG line drawing on black */
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr)); gap: 1rem; }
    .card { border: 1px solid var(--color-line); }
    .card:hover { border-color: var(--color-paper); }
    .card img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: var(--color-ink); }
    .card span { border-top: 1px solid var(--color-line); }
</style>
