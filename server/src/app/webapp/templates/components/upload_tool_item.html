{# first row of the `ls -l tools/ | column -t` table: pick a .py file to add a tool. Columns that do not
   apply to a file that is not uploaded yet read --- #}
<li class="contents">

    {# name: the chosen file name once one is picked #}
    <span id="upload-label" class="text-dim px-1 py-0.5 min-w-0">---</span>

    {# mode #}
    <span class="text-dim px-1 py-0.5">---</span>

    {# runs #}
    <span class="text-right text-dim px-1 py-0.5" style="min-width: 4ch">---</span>

    {# actions: the picker #}
    <span class="flex items-center gap-1 text-dim px-1 py-0.5">
        <input
            id="tool-upload"
            type="file"
            name="file"
            accept=".py"
            hx-post="{{ root_path }}/manage/model/upload"
            hx-encoding="multipart/form-data"
            hx-trigger="change"
            hx-swap="none"
            _="on change if my.files.length > 0 set #upload-label.innerText to my.files[0].name end
               on htmx:afterRequest if event.detail.successful send refresh to #tool-rows end"
            style="display: none;" />
        <label for="tool-upload" class="cursor-pointer px-1 hover:bg-paper hover:text-ink">[upload]</label>
    </span>
</li>
