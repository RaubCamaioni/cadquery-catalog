{# first row of the `ls -l tools/ | column -t` table: [create] opens the dialog for a new model. Columns that do
   not apply to a model that does not exist yet read --- #}
<li class="contents">
    <span class="text-dim px-1 py-0.5 min-w-0">---</span>
    <span class="text-dim px-1 py-0.5">---</span>
    <span class="text-right text-dim px-1 py-0.5" style="min-width: 4ch">---</span>
    <span class="flex items-center gap-1 text-dim px-1 py-0.5">
        <button type="button" class="cursor-pointer px-1 hover:bg-paper hover:text-ink"
            hx-get="{{ root_path }}/manage/model/create"
            hx-target="#model-dialog"
            hx-swap="innerHTML">[create]</button>
    </span>
</li>
