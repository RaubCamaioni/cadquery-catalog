
{# Meta #}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }}</title>
<link rel="icon" href="{{ root_path }}/static/favicon.svg?v={{ static_version }}" type="image/svg+xml">
<link rel="icon" href="{{ root_path }}/static/favicon.ico?v={{ static_version }}" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="{{ root_path }}/static/apple-touch-icon.png?v={{ static_version }}">

{# Styling #}
<link href="{{ root_path }}/static/output.css?v={{ static_version }}" rel="stylesheet">

{# Interactivity #}
<script src="{{ root_path }}/scripts/htmx.min.js"></script>
<script src="{{ root_path }}/scripts/_hyperscript.min.js"></script>
<script src="{{ root_path }}/scripts/meta-editors.js?v={{ static_version }}" defer></script>
{% include 'components/meta_style.html' %}
<script>
    // the underscore of a console field marks the caret: measure the text before the caret and
    // place the _ there (the native caret is invisible); re-placed on every edit, click or key
    (function () {
        const ctx = document.createElement("canvas").getContext("2d");
        function placeCaret(input) {
            const field = input.closest(".field");
            if (!field) return;
            ctx.font = getComputedStyle(input).font;
            // an unfocused field reports selection 0: its caret rests at the end of the text, like a prompt
            const focused = document.activeElement === input && input.selectionStart != null;
            const pos = focused ? input.selectionStart : input.value.length;
            const offset = input.getBoundingClientRect().left - field.getBoundingClientRect().left;
            const x = offset + ctx.measureText(input.value.slice(0, pos)).width - input.scrollLeft;
            field.style.setProperty("--caret", Math.max(0, x) + "px");
        }
        function placeAll() {
            document.querySelectorAll(".field input").forEach(placeCaret);
        }
        ["input", "keyup", "click", "focus", "select", "mouseup"].forEach(function (type) {
            document.addEventListener(type, function (event) {
                if (event.target.matches && event.target.matches(".field input")) placeCaret(event.target);
            }, true);
        });
        document.addEventListener("DOMContentLoaded", placeAll);
        document.addEventListener("htmx:afterSettle", placeAll);
    })();
    // console fields size to their text, so a click anywhere on a field's rule focuses its control
    document.addEventListener("click", function (event) {
        const field = event.target.closest && event.target.closest(".field, .pick");
        if (field && !event.target.matches("input, select")) {
            const control = field.querySelector("input, select");
            if (control) {
                control.focus();
                if (control.setSelectionRange) {  // type at the end, like a prompt
                    const end = control.value.length;
                    try { control.setSelectionRange(end, end); } catch (e) {}
                }
            }
        }
    });
</script>

{# ResponseError Alert #}
<script type="text/hyperscript">
    on htmx:responseError in <body/>
        call alert(JSON.parse(event.detail.xhr.response).detail)
    end
</script>
