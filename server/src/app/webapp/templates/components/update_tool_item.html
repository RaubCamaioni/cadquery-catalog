{# one row of the `ls -l tools/ | column -t` table: the list is a grid, so each cell lines up with its column #}
<li class="contents">

    {# name #}
    <span class="px-1 py-0.5 min-w-0"><a href="{{ root_path }}/model/{{ id }}" class="no-underline hover:bg-paper hover:text-ink">{{ name }}.py</a></span>

    {# mode column: the two switches #}
    <span class="flex items-center gap-1 px-1 py-0.5">
        <label class="switch" title="public: listed on the home page and runnable by anyone. Off: only you can see and run it.">
            <input
                type="checkbox"
                {{ public }}
                _="
                on change
                    fetch `{{ root_path }}/manage/model/settings/{{ id }}?public=${my.checked}` with method:'POST'
                end"/>
            <span class="label-text">[public]</span>
        </label>
        <label class="switch" title="anonymous: your alias is not shown as the author of this tool.">
            <input
                type="checkbox"
                {{ anonymous }}
                _="
                on change
                    fetch `{{ root_path }}/manage/model/settings/{{ id }}?anonymous=${my.checked}` with method:'POST'
                end"/>
            <span class="label-text">[anonymous]</span>
        </label>
    </span>

    {# size column: run count #}
    <span class="text-right text-dim px-1 py-0.5" style="min-width: 4ch" title="runs">{{ runs }}</span>

    {# actions #}
    <span class="flex items-center gap-1 text-dim px-1 py-0.5">
        <button type="button" class="cursor-pointer px-1 hover:bg-paper hover:text-ink"
            hx-get="{{ root_path }}/manage/model/{{ id }}/edit"
            hx-target="#model-dialog"
            hx-swap="innerHTML">[edit]</button>
        <a
            hx-delete="{{ root_path }}/manage/model/delete/{{ id }}"
            hx-trigger="click"
            hx-confirm="Delete {{ name }}.py?"
            hx-target="closest li"
            class="cursor-pointer no-underline px-1 hover:bg-paper hover:text-ink">[delete]</a>
    </span>
</li>
