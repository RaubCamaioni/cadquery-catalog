[project]
name = "sandbox"
version = "0.1.0"
description = "CadQuery Catalog model runtime: runs one model and exports it"
requires-python = ">=3.10"
dependencies = [
    "cadquery>=2.4.0",
    "pillow>=10.0.0",
]

[project.scripts]
sandbox = "sandbox.runner:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
