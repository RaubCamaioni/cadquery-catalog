name: Build and publish CadQuery Catalog images

# Every push and pull request builds both images to prove they build. Images are published
# (pushed to Docker Hub as `latest`, which the server deploys) only for a release tag
# `v<semver>` matching server/pyproject.toml, or when the workflow is run by hand from the
# Actions tab with "publish" ticked (the shortcut to deploy any branch without a release).

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the images as latest (deploys to raubcamaioni.com/catalog)"
        type: boolean
        default: true

env:
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check that the release tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -m1 '^version' server/pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in server/pyproject.toml"
            exit 1
          fi

      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/cadquery-catalog
          # only two tags per release (latest and the version) so Docker Hub is not littered with
          # one tag per commit; a manual deploy is tagged with its commit so it can be told apart
          tags: |
            type=semver,pattern={{version}}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ env.PUBLISH == 'true' }}

      - name: Login to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./containers/Containerfile.prod
          push: ${{ env.PUBLISH == 'true' }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          # org.opencontainers.image.revision lets the server skip a restart for an image it already runs
          labels: ${{ steps.meta.outputs.labels }}
          # plain manifests: podman on the server pulls these without attestation quirks
          provenance: false
          sbom: false
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/cadquery-catalog-sandbox
          # only two tags per release (latest and the version) so Docker Hub is not littered with
          # one tag per commit; a manual deploy is tagged with its commit so it can be told apart
          tags: |
            type=semver,pattern={{version}}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ env.PUBLISH == 'true' }}

      - name: Login to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the sandbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./containers/Containerfile.sandbox
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,scope=sandbox
